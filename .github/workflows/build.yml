name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 页面手动一键触发编译

permissions:
  contents: write

jobs:
  # ==========================================
  # 任务 1: 构建 Windows 安装包与单文件
  # ==========================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: app/go.sum

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: 安装 NSIS 打包工具
        run: choco install nsis -y

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 安装前端依赖
        run: |
          cd frontend
          npm install

      - name: 执行 Wails 跨平台构建 (Windows NSIS 安装程序)
        run: wails build -platform windows/amd64 -nsis

      - name: 上传构建产物 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: GoClip-Windows-x64
          path: |
            app/build/bin/*.exe

  # ==========================================
  # 任务 2: 构建 macOS 通用二进制 (.app / .zip)
  # ==========================================
  build-macos:
    name: Build macOS (Universal M1/M2/Intel)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: app/go.sum

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 安装前端依赖
        run: |
          cd frontend
          npm install

      - name: 执行 Wails 跨平台构建 (macOS Universal 通用架构)
        run: wails build -platform darwin/universal

      - name: 压缩 macOS .app 产物为 Zip
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent "GoClip.app" "GoClip-macOS-Universal.zip"

      - name: 上传构建产物 (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: GoClip-macOS-Universal
          path: app/build/bin/GoClip-macOS-Universal.zip

  # ==========================================
  # 任务 3: 自动发布到 GitHub Releases (有 Tag 时触发)
  # ==========================================
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: GoClip-Windows-x64
          path: release-assets/windows

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: GoClip-macOS-Universal
          path: release-assets/macos

      - name: 发布 Release 并挂载安装包
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*
            release-assets/macos/*
          draft: false
          prerelease: false
          generate_release_notes: true
